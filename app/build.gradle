plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.hadencain.vox'
    compileSdk 35

    defaultConfig {
        applicationId "com.hadencain.vox"
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters "arm64-v8a" }

        externalNativeBuild {
            cmake {
                cFlags "-O3"
                cppFlags "-std=c++17 -O3"
                // Force Release for the native lib even in debug app builds —
                // AGP defaults CMAKE_BUILD_TYPE=Debug, and ggml at -O0 is ~60x
                // slower (measured: 253s vs seconds infer on the 11s jfk.wav).
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_PLATFORM=android-33",
                          "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1'
    implementation 'com.google.mediapipe:tasks-genai:0.10.22'
    testImplementation 'junit:junit:4.13.2'

    implementation platform('androidx.compose:compose-bom:2024.09.02')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
